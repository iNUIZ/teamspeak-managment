name: Security

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  repository:
    name: Repository security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan source, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  images:
    name: Container scan (${{ matrix.name }}, ${{ matrix.runner || 'ubuntu-24.04' }})
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ts3
            base_image: teamspeak:3.13.8@sha256:6dfdfb22869adf50e1b66d024b360b786d57a85ea09e8e8fdb6cca23949b2813
            dockerfile: docker/ts3-hardened.Dockerfile
            scan_image: teamspeak-managment/ts3-hardened:ci
            context: docker
          - name: ts6
            base_image: teamspeaksystems/teamspeak6-server:6.0.0-beta13.1@sha256:d845f803aecf842c2df034c959c23ff2462357bacafb3807500885c5ec170fa1
            dockerfile: docker/ts6-hardened.Dockerfile
            scan_image: teamspeak-managment/ts6-hardened:ci
            context: docker
          - name: teaspeak
            base_image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
            dockerfile: docker/teaspeak-hardened.Dockerfile
            scan_image: teamspeak-managment/teaspeak-hardened:ci
            context: docker
          - name: manager
            base_image: teamhub/ts6-manager:base
            dockerfile: docker/manager-hardened.Dockerfile
            scan_image: teamspeak-managment/manager-hardened:ci
            context: .
          - name: manager
            runner: ubuntu-24.04-arm
            base_image: teamhub/ts6-manager:base
            dockerfile: docker/manager-hardened.Dockerfile
            scan_image: teamspeak-managment/manager-hardened:ci
            context: .
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build customized Manager base image
        if: matrix.name == 'manager'
        run: |
          ref=789a40d0eb2e66ae419ceb01d01d7243fc7b3072
          expected=1dd4841ee2b70c2256b52f8cb431dddc097901e15f0ae2e69ec853e243a45ed5
          curl -fsSL "https://github.com/uniskela/ts6-manager/archive/${ref}.tar.gz" -o manager.tar.gz
          printf '%s  %s\n' "$expected" manager.tar.gz | sha256sum -c -
          mkdir manager-source
          tar -xzf manager.tar.gz -C manager-source --strip-components=1
          cp -R manager-overlay/. manager-source/
          docker build -f manager-source/Dockerfile.all-in-one -t teamhub/ts6-manager:base manager-source
      - name: Build hardened image
        run: |
          docker build \
            --build-arg "BASE_IMAGE=${{ matrix.base_image }}" \
            --build-arg "INSTALL_TTS=${{ matrix.name == 'manager' }}" \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.scan_image }}" "${{ matrix.context }}"
      - name: Validate optional TR and EN speech engines
        if: matrix.name == 'manager'
        run: |
          docker run --rm --entrypoint sh "${{ matrix.scan_image }}" -c '
            set -eu
            for voice in tr_TR-dfki-medium en_US-lessac-medium; do
              printf "TeamSpeak test. Merhaba.\n" | /opt/teamhub-tts/bin/python -m piper -m "/opt/teamhub-voices/${voice}.onnx" -f /tmp/speech.wav
              python3 -c "import wave; w=wave.open(\"/tmp/speech.wav\"); assert w.getnframes() > 1000"
            done
          '
      - name: Scan image and create SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.scan_image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload findings to GitHub code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}-${{ matrix.runner || 'ubuntu-24.04' }}
      - name: Block fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.scan_image }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

