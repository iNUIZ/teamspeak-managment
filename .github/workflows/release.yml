name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag and version
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Build release archive
        run: |
          base="teamspeak-managment-${GITHUB_REF_NAME}"
          files=(install.sh install.ps1 bootstrap.ps1 package.json package-lock.json README.md README.en.md LICENSE CONTRIBUTING.md SECURITY.md CHANGELOG.md VERSION docs docker .gitignore .editorconfig)
          zip -r "${base}.zip" "${files[@]}"
          tar -czf "${base}.tar.gz" "${files[@]}"
          sha256sum "${base}.zip" "${base}.tar.gz" > "${base}-SHA256SUMS.txt"
      - name: Publish GitHub npm package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "teamspeak-managment-${GITHUB_REF_NAME}.zip" \
            "teamspeak-managment-${GITHUB_REF_NAME}.tar.gz" \
            "teamspeak-managment-${GITHUB_REF_NAME}-SHA256SUMS.txt" \
            --verify-tag \
            --generate-notes \
            --title "Teamspeak Managment ${GITHUB_REF_NAME}"
