name: Rust

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install ffmpeg and cmake
        run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Test
        run: cargo test --workspace --exclude teamhub-web --locked
      - name: Check the web panel builds for the browser
        run: cargo check -p teamhub-web --target wasm32-unknown-unknown --locked
