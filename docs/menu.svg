<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
  <title id="title">Teamspeak Managment etkileşimli menüsü</title>
  <desc id="desc">TeamSpeak 3, TeaSpeak, TeamSpeak 6, Manager, music bot, backup ve servis yönetimi seçeneklerini gösteren terminal penceresi.</desc>
  <rect width="960" height="630" rx="18" fill="#10141d"/>
  <rect x="1" y="1" width="958" height="628" rx="17" fill="none" stroke="#30394b" stroke-width="2"/>
  <circle cx="34" cy="31" r="7" fill="#ff5f57"/>
  <circle cx="57" cy="31" r="7" fill="#febc2e"/>
  <circle cx="80" cy="31" r="7" fill="#28c840"/>
  <text x="480" y="37" text-anchor="middle" fill="#8f9bad" font-family="Consolas,monospace" font-size="15">teamspeak-managment</text>
  <line x1="0" y1="57" x2="960" y2="57" stroke="#30394b"/>
  <g font-family="Consolas,monospace" font-size="19">
    <text x="38" y="97" fill="#67b7ff">Teamspeak Managment</text>
    <text x="310" y="97" fill="#8f9bad">v0.3.4</text>
    <text x="38" y="126" fill="#8f9bad">==================================</text>
    <text x="38" y="169" fill="#d8dee9">1) Docker gereksinimlerini kur</text>
    <text x="38" y="203" fill="#d8dee9">2) TeamSpeak 3 sunucusu kur</text>
    <text x="38" y="233" fill="#d8dee9">3) TeaSpeak sunucusu kur</text>
    <text x="38" y="263" fill="#d8dee9">4) TeamSpeak 6 sunucusu kur</text>
    <text x="38" y="293" fill="#d8dee9">5) TS6 Manager kur</text>
    <text x="38" y="323" fill="#d8dee9">6) Müzik botu bağlantı yönergesini göster</text>
    <text x="38" y="353" fill="#9be9a8">7) Önerilen tam paket</text>
    <text x="38" y="383" fill="#9be9a8">8) Manager'ı verileri koruyarak güncelle</text>
    <text x="38" y="413" fill="#d8dee9">9) Servis durumları</text>
    <text x="38" y="443" fill="#d8dee9">10) Logları göster</text>
    <text x="38" y="473" fill="#d8dee9">11) Servis başlat / durdur / yeniden başlat</text>
    <text x="38" y="503" fill="#d8dee9">12) Verileri yedekle</text>
    <text x="38" y="533" fill="#d8dee9">13) Bir bileşeni kaldır</text>
    <text x="38" y="585" fill="#8f9bad">Seçiminiz:</text>
    <rect x="181" y="566" width="10" height="24" fill="#67b7ff"/>
  </g>
</svg>
