<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
  <title id="title">Teamspeak Managment interactive menu</title>
  <desc id="desc">A terminal menu for TeamSpeak 3, TeaSpeak, TeamSpeak 6, Manager, music bot, backup, and service management.</desc>
  <rect width="960" height="630" rx="18" fill="#10141d"/>
  <rect x="1" y="1" width="958" height="628" rx="17" fill="none" stroke="#30394b" stroke-width="2"/>
  <circle cx="34" cy="31" r="7" fill="#ff5f57"/><circle cx="57" cy="31" r="7" fill="#febc2e"/><circle cx="80" cy="31" r="7" fill="#28c840"/>
  <text x="480" y="37" text-anchor="middle" fill="#8f9bad" font-family="Consolas,monospace" font-size="15">teamspeak-managment</text>
  <line x1="0" y1="57" x2="960" y2="57" stroke="#30394b"/>
  <g font-family="Consolas,monospace" font-size="19">
    <text x="38" y="97" fill="#67b7ff">Teamspeak Managment</text><text x="310" y="97" fill="#8f9bad">v0.3.4</text>
    <text x="38" y="126" fill="#8f9bad">==================================</text>
    <text x="38" y="169" fill="#d8dee9">1) Install Docker requirements</text>
    <text x="38" y="203" fill="#d8dee9">2) Install TeamSpeak 3 server</text>
    <text x="38" y="233" fill="#d8dee9">3) Install TeaSpeak server</text>
    <text x="38" y="263" fill="#d8dee9">4) Install TeamSpeak 6 server</text>
    <text x="38" y="293" fill="#d8dee9">5) Install TS6 Manager</text>
    <text x="38" y="323" fill="#d8dee9">6) Show music bot connection guide</text>
    <text x="38" y="353" fill="#9be9a8">7) Recommended full stack</text>
    <text x="38" y="383" fill="#9be9a8">8) Update Manager and preserve data</text>
    <text x="38" y="413" fill="#d8dee9">9) Service status</text>
    <text x="38" y="443" fill="#d8dee9">10) Show logs</text>
    <text x="38" y="473" fill="#d8dee9">11) Start / stop / restart a service</text>
    <text x="38" y="503" fill="#d8dee9">12) Back up data</text>
    <text x="38" y="533" fill="#d8dee9">13) Remove a component</text>
    <text x="38" y="585" fill="#8f9bad">Selection:</text><rect x="162" y="566" width="10" height="24" fill="#67b7ff"/>
  </g>
</svg>
