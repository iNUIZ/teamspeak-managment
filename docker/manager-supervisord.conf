[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:sidecar]
priority=100
command=/usr/local/bin/sidecar
autostart=true
autorestart=true
startsecs=2
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0

[program:youtube-pot]
priority=150
command=/opt/teamhub-pot/node /opt/teamhub-pot/quiet-provider.mjs --host 127.0.0.1 --port 4416
directory=/opt/teamhub-pot
autostart=true
autorestart=true
startsecs=2
startretries=3
stopasgroup=true
killasgroup=true
# Never persist upstream token/proxy diagnostics.
stderr_logfile=/dev/null
stdout_logfile=/dev/null
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0

[program:backend]
priority=200
command=/usr/local/bin/start-backend.sh
directory=/app/packages/backend
autostart=true
autorestart=true
startsecs=15
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0

[program:nginx]
priority=300
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=1
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
